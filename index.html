<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WJU-T - 共有・保存対応版</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: grid;
            grid-template-columns: 75% 25%;
            overflow: hidden;
            font-family: sans-serif;
        }
        .left-area {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
        }
        main {
            display: grid;
            width: min(70vw, 70vh);
            height: min(70vw, 70vh);
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            border: 2px solid gray;
            padding: 2px;
            box-sizing: border-box;
        }
        main div {
            border: 2px solid gray;
            aspect-ratio: 1 / 1;
            position: relative;
            cursor: pointer;
        }
        .center-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%; height: 90%;
            display: flex; justify-content: center; align-items: center;
            text-align: center; word-break: break-word;
            line-height: 1.1; pointer-events: none; user-select: none;
            color: #fff; font-size: 10px;
        }
        .right-area {
            border-left: 2px solid #444;
            padding: 10px;
            background: #f5f5f5;
            overflow-y: auto;
        }
        .color-button {
            width: 100%;
            height: 30px;
            margin: 2px 0;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
        }
        .color-button.light { color: #000; }
        .control-panel {
            margin-top: 20px;
            padding-top: 10px;
            border-top: 2px solid #ccc;
        }
        .btn-action {
            background: #444;
            color: white;
            padding: 10px;
            width: 100%;
            margin-bottom: 8px;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }
        h2, h3 { margin: 10px 0; text-align: center; }
    </style>
</head>
<body>

    <div class="left-area">
        <main id="grid-main"></main>
    </div>

    <div class="right-area">
        <h2>パレット</h2>
        <div id="palette"></div>

        <div class="control-panel">
            <h3>データ管理</h3>
            <button class="btn-action" style="background: #28a745;" onclick="copyShareURL()">🔗 共有URLをコピー</button>
            <button class="btn-action" style="background: #dc3545;" onclick="resetAll()">⚠️ 全リセット</button>
        </div>
    </div>

    <script src="const.js"></script>
    <script>
        let selectedColor = null;
        const main = document.getElementById("grid-main");
        const palette = document.getElementById("palette");
        const cells = [];

        const isLight = hex => parseInt(hex, 16) > 0xffffff / 2;

        // 1. パレット生成
        colors.forEach(([name, hex]) => {
            const btn = document.createElement("button");
            btn.className = "color-button";
            btn.style.background = "#" + hex;
            btn.textContent = name;
            if (isLight(hex)) btn.classList.add("light");
            else btn.style.color = "#fff";
            btn.onclick = () => selectedColor = "#" + hex;
            palette.appendChild(btn);
        });

        // 2. グリッド生成
        for (let i = 0; i < 100; i++) {
            const cell = document.createElement("div");
            const text = document.createElement("span");
            text.className = "center-text";
            text.textContent = `${i % 10},${Math.floor(i / 10)}`;
            cell.appendChild(text);
            
            cell.onclick = () => {
                if (selectedColor) {
                    applyColor(cell, selectedColor);
                    saveToLocal(); // 塗るたびに自動保存
                }
            };
            main.appendChild(cell);
            cells.push(cell);
        }

        function applyColor(cell, color) {
            cell.style.background = color;
            const text = cell.querySelector(".center-text");
            const hex = color.replace('#', '');
            const brightness = parseInt(hex, 16);
            text.style.color = brightness < 0x888888 ? "#fff" : "#000";
        }

        function fitText(textEl) {
            let size = 20;
            const parent = textEl.parentElement;
            textEl.style.fontSize = size + "px";
            while ((textEl.scrollWidth > parent.clientWidth || textEl.scrollHeight > parent.clientHeight) && size > 6) {
                textEl.style.fontSize = (--size) + "px";
            }
        }

        // 初期配置（const.jsのデータ）を適用
        function applyBTargets() {
            Btargets.forEach(([x, y, label, colorIndex]) => {
                const cell = cells[y * 10 + x];
                const text = cell.querySelector(".center-text");
                text.textContent = label;
                const bgColor = "#" + colors[colorIndex - 1][1];
                applyColor(cell, bgColor);
                fitText(text);
            });
        }

        // --- 保存・共有のコア機能 ---

        function saveToLocal() {
            const data = {};
            cells.forEach((cell, i) => {
                if (cell.style.background) {
                    data[i] = cell.style.background;
                }
            });
            localStorage.setItem("JPunion_save_v2", JSON.stringify(data));
        }

        function copyShareURL() {
            const currentData = localStorage.getItem("JPunion_save_v2");
            if (!currentData || currentData === "{}") {
                alert("保存するデータがありません。");
                return;
            }
            // データを圧縮してURLエンコード
            const encoded = btoa(unescape(encodeURIComponent(currentData)));
            const url = `${window.location.origin}${window.location.pathname}?d=${encoded}`;
            
            navigator.clipboard.writeText(url).then(() => {
                alert("共有URLをコピーしました！このURLを開けば今の盤面が再現されます。");
            });
        }

        function loadBoard() {
            applyBTargets(); // まず基本形

            const params = new URLSearchParams(window.location.search);
            const urlData = params.get('d');

            // URLにデータがあれば優先して読み込む
            if (urlData) {
                try {
                    const decoded = decodeURIComponent(escape(atob(urlData)));
                    localStorage.setItem("JPunion_save_v2", decoded);
                    window.history.replaceState({}, "", window.location.pathname);
                } catch (e) { console.error("URL読込失敗"); }
            }

            // ローカルストレージから復元
            const saved = JSON.parse(localStorage.getItem("JPunion_save_v2") || "{}");
            Object.entries(saved).forEach(([index, color]) => {
                if (cells[index]) applyColor(cells[index], color);
            });
        }

        function resetAll() {
            if (confirm("すべての塗りつぶしを消去して初期状態に戻しますか？")) {
                localStorage.removeItem("JPunion_save_v2");
                location.reload();
            }
        }

        // 起動時に読み込み
        loadBoard();
        
    </script>
</body>
</html>
