<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WJU-T - 拠点保護版</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: grid;
            grid-template-columns: 75% 25%;
            overflow: hidden;
            font-family: sans-serif;
        }

        .left-area {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
        }

        main {
            display: grid;
            width: min(70vw, 70vh);
            height: min(70vw, 70vh);
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            border: 2px solid gray;
            padding: 2px;
            box-sizing: border-box;
        }

        main div {
            border: 2px solid gray;
            aspect-ratio: 1 / 1;
            position: relative;
            cursor: pointer;
        }

        .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            height: 90%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            word-break: break-word;
            line-height: 1.1;
            pointer-events: none;
            user-select: none;
            color: #fff;
            font-size: 10px;
        }

        .right-area {
            border-left: 2px solid #444;
            padding: 10px;
            background: #f5f5f5;
            overflow-y: auto;
        }

        .color-button {
            width: 100%;
            height: 30px;
            margin: 2px 0;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
        }

        .color-button.light {
            color: #000;
        }

        h2, h3 {
            margin: 10px 0;
            text-align: center;
        }

        .leaderboard {
            border-bottom: 2px solid #444;
            padding: 10px;
            background: #fafafa;
            margin-bottom: 10px;
        }

        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #ddd;
            font-size: 12px;
        }

        .control-panel {
            margin-top: 20px;
            padding-top: 10px;
            border-top: 2px solid #ccc;
        }

        .btn-action {
            background: #444;
            color: white;
            padding: 10px;
            width: 100%;
            margin-bottom: 8px;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>

<body>

    <div class="left-area">
        <main></main>
    </div>
    <div class="right-area">
        <div class="leaderboard" id="leaderboard">
            <h2>リーダーボード</h2>
            <div id="leaderboard-content"></div>
        </div>
        <div id="palette">
            <h2>パレット</h2>
        </div>

        <div class="control-panel">
            <h3>データ管理</h3>
            <button class="btn-action" style="background: #28a745;" onclick="copyShareURL()">🔗 共有URLをコピー</button>
            <button class="btn-action" style="background: #dc3545;" onclick="resetAll()">⚠️ 全リセット</button>
        </div>
    </div>

    <script src="const.js"></script>
    <script>
        let selectedColor = null;
        const main = document.querySelector("main");
        const palette = document.getElementById("palette");
        const cells = [];
        const protectedCells = new Set(); // 保護されたマスのインデックスを保持

        const isLight = hex => parseInt(hex, 16) > 0xffffff / 2;
        const toHex = rgb => {
            if (rgb.startsWith("#")) return rgb;
            const match = rgb.match(/\d+/g);
            if (!match) return "#000000";
            return "#" + match.slice(0, 3).map(x => ("0" + (+x).toString(16)).slice(-2)).join("");
        };

        // 1. パレット生成
        colors.forEach(([name, hex]) => {
            const btn = document.createElement("button");
            btn.className = "color-button";
            btn.style.background = "#" + hex;
            btn.textContent = name;
            btn.style.color = isLight(hex) ? "#000" : "#fff";
            btn.onclick = () => selectedColor = "#" + hex;
            palette.appendChild(btn);
        });

        // 2. グリッド生成
        for (let i = 0; i < 100; i++) {
            const cell = document.createElement("div");
            cell.dataset.index = i;

            const text = document.createElement("span");
            text.className = "center-text";
            text.textContent = `${i % 10},${Math.floor(i / 10)}`;
            cell.appendChild(text);
            cell.textEl = text;

            cell.onclick = () => {
                // 保護されているマスの場合は何もしない
                if (protectedCells.has(i)) {
                    console.log("このマスは保護されています");
                    return;
                }
                if (!selectedColor) return;
                applyColor(cell, selectedColor);
                saveToLocal();
                updateLeaderboard();
            };

            main.appendChild(cell);
            cells.push(cell);
        }

        function applyColor(cell, color) {
            cell.style.background = color;
            const hex = toHex(color).replace('#', '');
            const brightness = parseInt(hex, 16);
            cell.textEl.style.color = brightness < 0x888888 ? "#fff" : "#000";
        }

        function fitText(textEl) {
            let size = 28;
            const parent = textEl.parentElement;
            textEl.style.fontSize = size + "px";
            while ((textEl.scrollWidth > parent.clientWidth || textEl.scrollHeight > parent.clientHeight) && size > 8) {
                textEl.style.fontSize = (--size) + "px";
            }
        }

        function applyBTargets() {
            protectedCells.clear();
            Btargets.forEach(([x, y, label, colorIndex]) => {
                const index = y * 10 + x;
                const cell = cells[index];
                
                // 拠点を保護リストに追加
                protectedCells.add(index);
                
                cell.textEl.textContent = label;
                fitText(cell.textEl);
                const bgColor = "#" + colors[colorIndex - 1][1];
                applyColor(cell, bgColor);
                
                // 拠点だと分かりやすくするために枠線を少し太くする
                cell.style.boxShadow = "inset 0 0 0 2px rgba(255,255,255,0.3)";
            });
        }

        function updateLeaderboard() {
            const lb = document.getElementById("leaderboard-content");
            const counts = {};

            Btargets.forEach(([x, y, label, colorIndex]) => {
                const color = "#" + colors[colorIndex - 1][1];
                if (!counts[color]) counts[color] = { count: 0, labels: new Set() };
                counts[color].labels.add(label);
            });

            cells.forEach(cell => {
                if (!cell.style.background) return;
                const hex = toHex(cell.style.background);
                if (!counts[hex]) counts[hex] = { count: 0, labels: new Set() };
                counts[hex].count++;
            });

            lb.innerHTML = "";
            Object.entries(counts)
                .sort((a, b) => b[1].count - a[1].count)
                .forEach(([color, data]) => {
                    const div = document.createElement("div");
                    div.className = "leaderboard-entry";
                    div.innerHTML = `
                        <span>
                            <span style="display:inline-block;width:12px;height:12px;background:${color};border:1px solid #000;margin-right:6px;"></span>
                            ${[...data.labels].join(" / ") || "未所属"}
                        </span>
                        <span>${data.count} マス</span>
                    `;
                    lb.appendChild(div);
                });
        }

        const STORAGE_KEY = "WJU_T_SaveData_V2";

        function saveToLocal() {
            const data = {};
            cells.forEach((cell, i) => {
                // 保護されていないマス（ユーザーが塗ったマス）だけ保存
                if (!protectedCells.has(i) && cell.style.background) {
                    data[i] = toHex(cell.style.background);
                }
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function copyShareURL() {
            const currentData = localStorage.getItem(STORAGE_KEY);
            if (!currentData || currentData === "{}") {
                alert("保存するデータがありません。");
                return;
            }
            const encoded = btoa(unescape(encodeURIComponent(currentData)));
            const url = `${window.location.origin}${window.location.pathname}?d=${encoded}`;
            navigator.clipboard.writeText(url).then(() => {
                alert("共有URLをコピーしました！");
            });
        }

        function loadBoard() {
            applyBTargets(); 

            const params = new URLSearchParams(window.location.search);
            const urlData = params.get('d');
            if (urlData) {
                try {
                    const decoded = decodeURIComponent(escape(atob(urlData)));
                    localStorage.setItem(STORAGE_KEY, decoded);
                    window.history.replaceState({}, "", window.location.pathname);
                } catch (e) { console.error("URL読込失敗"); }
            }

            const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
            Object.entries(saved).forEach(([index, color]) => {
                const idx = parseInt(index);
                // 保存データがあっても、そこが現在は拠点（保護）なら上書きしない
                if (cells[idx] && !protectedCells.has(idx)) {
                    applyColor(cells[idx], color);
                }
            });
            updateLeaderboard();
        }

        function resetAll() {
            if (confirm("すべての塗りつぶしを消去しますか？（拠点は残ります）")) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }

        document.addEventListener("keydown", async (e) => {
            if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "s") {
                e.preventDefault();
                const rightArea = document.querySelector(".right-area");
                rightArea.style.display = "none";
                try {
                    const canvas = await html2canvas(document.body);
                    canvas.toBlob(async (blob) => {
                        await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
                        alert("スクショをコピーしました！");
                    });
                } catch (err) { console.error(err); }
                rightArea.style.display = "block";
            }
        });

        loadBoard();
    </script>
</body>
</html>
